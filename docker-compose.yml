# ─────────────────────────────────────────────────────────────
# 큐브티(Cubetee) 단일 VPS 배포 - docker compose
# 웹(Next.js) + PostgreSQL. 실제 값은 .env 파일에서 주입.
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-shiftee}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shiftee}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shiftee}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 설정하세요}
      # 알림·메일 링크에 쓰는 주소(런타임 주입). 빌드에 박히지 않으므로 이미지를 공용으로 쓸 수 있다.
      # 기존 .env 를 그대로 둬도 되게 NEXT_PUBLIC_* 를 fallback 으로 읽는다.
      APP_URL: ${APP_URL:-${NEXT_PUBLIC_APP_URL}}
      API_URL: ${API_URL:-${NEXT_PUBLIC_API_URL}}
      # HTTPS 적용 전(HTTP 임시)에는 .env에 COOKIE_SECURE=false. HTTPS 되면 true(또는 삭제).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      FONT_PATH: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
      # SMTP(이메일 발송). .env 가 비어 있으면 빈 값이 들어가고 메일은 보내지 않는다(경고 로그).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # 발신자 표시. email.ts 가 From 헤더에 그대로 쓰므로 빠지면 안 된다.
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-큐브티}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-${SMTP_USER:-}}
    ports:
      - "3000:3000"
    volumes:
      # 업로드 파일(계약서/서명/템플릿)은 컨테이너 재생성에도 보존
      - uploads:/app/apps/web/uploads

volumes:
  pgdata:
  uploads:
