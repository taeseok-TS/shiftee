# ─────────────────────────────────────────────────────────────
# 큐브티(Cubetee) 단일 VPS 배포 - docker compose
# 웹(Next.js) + PostgreSQL. 실제 값은 .env 파일에서 주입.
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-shiftee}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-shiftee}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-shiftee}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 를 .env 에 설정하세요}
      # 알림·메일 링크에 쓰는 주소(런타임 주입). 빌드에 박히지 않으므로 이미지를 공용으로 쓸 수 있다.
      # 기존 .env 를 그대로 둬도 되게 NEXT_PUBLIC_* 를 fallback 으로 읽는다.
      APP_URL: ${APP_URL:-${NEXT_PUBLIC_APP_URL}}
      API_URL: ${API_URL:-${NEXT_PUBLIC_API_URL}}
      # HTTPS 적용 전(HTTP 임시)에는 .env에 COOKIE_SECURE=false. HTTPS 되면 true(또는 삭제).
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # 업로드 파일 접근 게이트 - 이 경로군은 세션 또는 접근 티켓(?t=)이 있어야 열린다.
      # work(채팅 첨부)를 넣기 전에 반드시 앱 확산 확인 + 채널 멤버십 판정을 먼저 할 것.
      # 2026-09-02 에 그냥 켰다가 앱 첨부가 전부 401 이 됐다. "off" 면 게이트 없음.
      # 프록시(Caddy) 접근 로그 - 실패 응답을 하루 한 번 집계해 관리자에게 알린다.
      # 앱의 오류 기록은 "터진" 오류만 잡아서 try/catch 로 처리된 4xx.5xx 가 안 남는다.
      # 값이 없으면 기능이 조용히 꺼진다(고객사 인스턴스 등).
      ACCESS_LOG_PATH: ${ACCESS_LOG_PATH:-/var/log/caddy/cubetee.log}
      # 앱 밖 감시(워치독)가 남기는 신호. **값이 있을 때만** 되감시한다 —
      # 워치독을 안 깐 인스턴스(고객사 등)에서 매일 오탐이 나던 것을 막는다(2026-09-04).
      WATCHDOG_BEAT_PATH: ${WATCHDOG_BEAT_PATH:-}
      UPLOADS_GATE: ${UPLOADS_GATE:-signatures,contracts}
      FONT_PATH: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
      # 워드→PDF 변환기 주소 (완료 계약서 PDF 다운로드)
      GOTENBERG_URL: http://gotenberg:3000
      # SMTP(이메일 발송). .env 가 비어 있으면 빈 값이 들어가고 메일은 보내지 않는다(경고 로그).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # 발신자 표시. email.ts 가 From 헤더에 그대로 쓰므로 빠지면 안 된다.
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-큐브티}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-${SMTP_USER:-}}
    # 프로세스가 살아 있어도 응답을 못 하는 상태(행)는 restart 정책이 못 잡는다.
    # 헬스체크가 있어야 docker ps 에 unhealthy 로 드러난다.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get({host:'127.0.0.1',port:3000,path:'/api/health-beat'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "3000:3000"
    volumes:
      # 업로드 파일(계약서/서명/템플릿)은 컨테이너 재생성에도 보존
      - uploads:/app/apps/web/uploads
      # 접근 로그 읽기 전용 - 실패 응답 집계용. 없으면 기능이 꺼질 뿐 기동에는 지장 없다.
      - /var/log/caddy:/var/log/caddy:ro

  # 워드→PDF 변환기 (완료 계약서 PDF 다운로드용). 내부 네트워크 전용 — 포트 미노출.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    mem_limit: 768m
    volumes:
      # 한글 폰트(맑은고딕.바탕.굴림) - LibreOffice 변환 시 명조 폴백 방지 (2026-08-27 #118)
      # 폰트는 MS 라이선스라 저장소에 없다. 폴더가 없으면 도커가 빈 폴더를 만들 뿐이라
      # 오류 없이 뜨고 변환 결과만 명조로 폴백된다 - 새 서버에 올릴 때 반드시 넣을 것.
      - ${GOTENBERG_FONTS_DIR:-./gotenberg-fonts}:/usr/share/fonts/custom:ro
    # 행(hang)이 실제로 나는 쪽은 LibreOffice, 즉 이쪽이다. web 에만 넣고 "양쪽에 넣었다"고
    # 적었던 것을 바로잡는다 (2026-09-03). gotenberg 는 /health 를 제공한다.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command:
      - gotenberg
      - --api-timeout=60s
      - --libreoffice-restart-after=20

volumes:
  pgdata:
  uploads:
