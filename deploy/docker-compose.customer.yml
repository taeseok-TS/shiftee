# ─────────────────────────────────────────────────────────────
# 큐브티 — 고객사 1곳용 인스턴스
#
# 루트의 docker-compose.yml(직영 운영용)과 다른 점:
#   · build 대신 미리 만들어 둔 image 를 쓴다  → 고객사마다 빌드하지 않는다
#   · 포트를 파라미터로 받는다                 → 한 서버에 여러 고객사를 올릴 수 있다
#   · 비밀값을 전부 .env 에서 주입한다          → 고객사끼리 격리
#
# 컨테이너·볼륨 이름은 compose 프로젝트명(-p)으로 자동 격리된다.
#   docker compose -p cubetee-<코드> -f docker-compose.customer.yml up -d
# ─────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 .env 에 없습니다}
      POSTGRES_DB: ${POSTGRES_DB:-cubetee}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup:/backup           # 일일 덤프 내보내는 곳
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-cubetee}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    # 미리 빌드한 이미지. 태그는 .env 의 CUBETEE_IMAGE 로 고정한다.
    image: ${CUBETEE_IMAGE:?CUBETEE_IMAGE 가 .env 에 없습니다}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      # up -d web 만 해도 함께 뜨도록 의존으로 건다 (설치·갱신 스크립트가 web 만 지정한다)
      gotenberg:
        condition: service_started
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-cubetee}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 가 .env 에 없습니다}
      # 런타임 주입 (env 리팩터 완료 후 유효 — deploy/README.md 「선행 작업」 참고)
      APP_URL: ${APP_URL}
      API_URL: ${APP_URL}/api
      # 리팩터 전 이미지와의 호환을 위해 함께 넣어 둔다
      NEXT_PUBLIC_APP_URL: ${APP_URL}
      NEXT_PUBLIC_API_URL: ${APP_URL}/api
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # 업로드 파일 접근 게이트 - 이 경로군은 세션 또는 접근 티켓(?t=)이 있어야 열린다.
      # work(채팅 첨부)를 넣기 전에 반드시 앱 확산 확인 + 채널 멤버십 판정을 먼저 할 것.
      # 2026-09-02 에 그냥 켰다가 앱 첨부가 전부 401 이 됐다. "off" 면 게이트 없음.
      UPLOADS_GATE: ${UPLOADS_GATE:-signatures,contracts}
      # 워드->PDF 변환기 주소. 이 서비스가 없으면 계약서 PDF 열람.다운로드가 전부 실패한다.
      GOTENBERG_URL: http://gotenberg:3000
      FONT_PATH: /usr/share/fonts/truetype/nanum/NanumGothic.ttf
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      # 발신자 표시. email.ts 가 From 헤더에 그대로 쓰므로 빠지면 안 된다.
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-큐브티}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-${SMTP_USER:-}}
    # 프로세스가 살아 있어도 응답을 못 하는 상태(행)는 restart 정책이 못 잡는다.
    # 헬스체크가 있어야 docker ps 에 unhealthy 로 드러난다.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get({host:'127.0.0.1',port:3000,path:'/api/health-beat'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    ports:
      - "${WEB_PORT:?WEB_PORT 가 .env 에 없습니다}:3000"
    volumes:
      - uploads:/app/apps/web/uploads
      # 초기화 스크립트 (이미지 재빌드 없이 쓸 수 있게 마운트).
      # pnpm 워크스페이스라 의존성이 apps/web/node_modules 에만 심볼릭되어 있으므로
      # 반드시 apps/web 안에 두어야 require("@prisma/client") 가 해석된다.
      - ./init-tenant.js:/app/apps/web/init-tenant.js:ro

  # 워드->PDF 변환기 (계약서 열람.완료본 다운로드에 쓴다). 내부 네트워크 전용 - 포트 미노출.
  # 고객사마다 별도 컨테이너로 뜬다(compose 프로젝트명으로 격리). 메모리 768MB 를 잡으므로
  # 한 서버에 고객사를 여러 곳 올릴 때는 그만큼을 더해 사양을 잡을 것.
  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    mem_limit: 768m
    volumes:
      # 한글 폰트(맑은고딕.바탕.굴림). 없으면 명조로 폴백돼 서식이 어긋난다 (2026-08-27 #118).
      # MS 라이선스 폰트라 저장소에 넣지 않는다 - 서버의 공용 폴더를 읽기전용으로 함께 쓴다.
      # 폴더가 없으면 도커가 빈 폴더를 만들 뿐 기동은 되고, 변환 결과의 서식만 어긋난다.
      - ${GOTENBERG_FONTS_DIR:-./gotenberg-fonts}:/usr/share/fonts/custom:ro
    command:
      - gotenberg
      - --api-timeout=60s
      - --libreoffice-restart-after=20

volumes:
  pgdata:
  uploads:
