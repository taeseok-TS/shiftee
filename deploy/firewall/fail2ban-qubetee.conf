# 큐브티 fail2ban (2026-09-04 보강 — 검증관 C B-2)
#
# 종전 문제: 10분 창에 5회만 넘지 않으면 영원히 안 걸렸다. 실제로 24시간에 203회를
# 시도하는 IP 가 있는데 **차단 목록은 비어 있었다**(1시간이면 풀려서 계속 돌아온다).
#
# 비밀번호 인증은 이미 꺼져 있으므로(열쇠 전용) 뚫릴 위험보다 **로그 소음과 자원 낭비**가
# 문제다. 그래서 한 번 걸린 놈을 오래 붙잡는 recidive(재범) 감옥을 함께 쓴다.

[sshd]
enabled  = true
backend  = systemd
maxretry = 5
findtime = 10m
bantime  = 4h
# ⚠ ignoreip 는 고정 목록이다. 디렉터 노트북은 사무실.지점.집.카페를 오가며 IP 가 바뀐다
#   (2026-09-03 에 7개 IP 를 확인했다). 다만 디렉터는 SSH 를 쓰지 않고, 배포는 열쇠로만
#   들어오므로 실피해는 없다. 새 장소에서 막히면 여기에 한 줄 추가한다.
ignoreip = 127.0.0.0/8 ::1 61.75.82.128 112.218.190.34 1.215.32.174 116.122.155.189 112.220.138.187 14.47.82.197 118.131.180.243

# 재범 — 이미 한 번 차단된 IP 가 또 오면 **모든 포트를 1주일** 막는다.
# 느리게 두드려 findtime 을 피해 가는 공격자를 잡는 것이 목적이다.
[recidive]
enabled   = true
backend   = auto
logpath   = /var/log/fail2ban.log
maxretry  = 2
findtime  = 1d
bantime   = 1w
banaction = nftables[type=allports]
ignoreip  = 127.0.0.0/8 ::1 61.75.82.128 112.218.190.34 1.215.32.174 116.122.155.189 112.220.138.187 14.47.82.197 118.131.180.243
